server:
  address: 0.0.0.0

spring:
  application:
    name: vital-care-api

  profiles:
    active: local

  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/vital-care
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_schema: vital_care

  jackson:
    default-property-inclusion: non_empty
    property-naming-strategy: SNAKE_CASE
    serialization:
        indent-output: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email, public_profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v12.0/dialog/oauth
            token-uri: https://graph.facebook.com/v12.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v12.0/me?fields=id,name,email,picture
            user-name-attribute: id

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-exp-minutes: 15
    refresh-exp-days: 30

management:
  tracing:
    enabled: true
    sampling:
      probability: 0.0
  endpoints:
    web:
      exposure:
        include: health, info, metrics
